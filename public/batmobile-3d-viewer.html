<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Batmobile · 3D Archive</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #04040a;
            font-family: 'Cinzel', serif;
            color: #fff;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Raleway:wght@300;400;600&display=swap');

        :root {
            --gold: #f5c518;
            --gold-dim: rgba(245, 197, 24, .15);
            --dark: #04040a;
            --mid: #0d0d14;
            --border: rgba(245, 197, 24, .1);
        }

        /* ─── Custom cursor — matches main Batman site ───── */
        * {
            cursor: none !important
        }

        #bat-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            width: 32px;
            height: 14px;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 5px rgba(245, 197, 24, .9)) drop-shadow(0 0 12px rgba(245, 197, 24, .4));
            transition: transform .03s linear;
            will-change: left, top;
        }

        #cursor-ring {
            position: fixed;
            pointer-events: none;
            z-index: 99998;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(245, 197, 24, .45);
            transform: translate(-50%, -50%);
            transition: left .08s ease, top .08s ease, width .3s, height .3s;
            will-change: left, top;
        }

        /* ─── Layout ─────────────────────────────────────── */
        #shell {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 56px 1fr 100px;
            grid-template-columns: 280px 1fr;
            background: var(--dark);
        }

        /* ─── Topbar ─────────────────────────────────────── */
        #topbar {
            grid-column: 1/-1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .tb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Cinzel', serif;
            font-size: .82rem;
            letter-spacing: .5em;
            color: var(--gold);
        }

        .tb-logo svg {
            filter: drop-shadow(0 0 6px rgba(245, 197, 24, .7))
        }

        .tb-title {
            font-size: .55rem;
            letter-spacing: .4em;
            color: rgba(245, 197, 24, .35);
            text-transform: uppercase;
        }

        .tb-controls {
            display: flex;
            align-items: center;
            gap: 16px
        }

        .tb-btn {
            background: none;
            border: 1px solid rgba(245, 197, 24, .18);
            padding: 5px 14px;
            font-family: 'Raleway', sans-serif;
            font-size: .55rem;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: rgba(245, 197, 24, .5);
            cursor: none;
            transition: all .25s;
        }

        .tb-btn:hover {
            color: var(--gold);
            border-color: rgba(245, 197, 24, .5);
            background: rgba(245, 197, 24, .05)
        }

        .tb-status {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: 'Raleway', sans-serif;
            font-size: .5rem;
            letter-spacing: .22em;
            color: rgba(245, 197, 24, .35);
            text-transform: uppercase;
            border: 1px solid rgba(245, 197, 24, .08);
            padding: 4px 12px;
        }

        .status-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 8px rgba(245, 197, 24, .8);
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .2
            }
        }

        /* ─── Sidebar ────────────────────────────────────── */
        #sidebar {
            grid-row: 2;
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, .4);
            border-right: 1px solid var(--border);
            overflow: hidden;
        }

        .sidebar-label {
            font-family: 'Raleway', sans-serif;
            font-size: .48rem;
            letter-spacing: .32em;
            color: rgba(245, 197, 24, .25);
            text-transform: uppercase;
            padding: 18px 22px 10px;
            border-bottom: 1px solid rgba(245, 197, 24, .05);
        }

        .car-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 22px;
            background: none;
            border: none;
            border-bottom: 1px solid rgba(245, 197, 24, .04);
            border-left: 2px solid transparent;
            text-align: left;
            cursor: none;
            transition: all .25s;
            position: relative;
            overflow: hidden;
        }

        .car-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(245, 197, 24, .07), transparent);
            opacity: 0;
            transition: opacity .3s;
        }

        .car-btn:hover::before,
        .car-btn.active::before {
            opacity: 1
        }

        .car-btn.active {
            border-left-color: var(--gold);
            background: rgba(245, 197, 24, .04)
        }

        .car-btn:hover:not(.active) {
            background: rgba(245, 197, 24, .02)
        }

        .car-num {
            font-family: 'Cinzel', serif;
            font-size: .55rem;
            color: rgba(245, 197, 24, .2);
            letter-spacing: .1em;
            transition: color .25s;
            min-width: 20px;
        }

        .car-btn.active .car-num,
        .car-btn:hover .car-num {
            color: rgba(245, 197, 24, .6)
        }

        .car-info {
            flex: 1;
            min-width: 0
        }

        .car-name {
            font-family: 'Cinzel', serif;
            font-size: .88rem;
            font-weight: 700;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color .25s;
        }

        .car-btn.active .car-name,
        .car-btn:hover .car-name {
            color: #ddd
        }

        .car-era {
            font-family: 'Raleway', sans-serif;
            font-size: .5rem;
            letter-spacing: .14em;
            color: #2a2a2a;
            text-transform: uppercase;
            margin-top: 3px;
            transition: color .25s;
        }

        .car-btn.active .car-era {
            color: rgba(245, 197, 24, .35)
        }

        .car-arrow {
            font-size: .55rem;
            color: rgba(245, 197, 24, .15);
            transition: color .25s, transform .25s;
        }

        .car-btn.active .car-arrow,
        .car-btn:hover .car-arrow {
            color: rgba(245, 197, 24, .5);
            transform: translateX(3px);
        }

        /* loading state in sidebar */
        .car-load {
            font-family: 'Raleway', sans-serif;
            font-size: .48rem;
            letter-spacing: .15em;
            color: rgba(245, 197, 24, .2);
            text-transform: uppercase;
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
        }

        .car-btn.loading .car-load {
            display: block
        }

        .car-btn.loading .car-arrow {
            display: none
        }

        /* ─── Canvas viewport ────────────────────────────── */
        #viewport {
            grid-row: 2;
            position: relative;
            overflow: hidden;
            background: #b8b8b8;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block
        }

        /* ─── HUD overlays ───────────────────────────────── */
        .hud-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 5
        }

        .hud-corner--tl {
            top: 16px;
            left: 16px;
            border-top: 1px solid rgba(245, 197, 24, .35);
            border-left: 1px solid rgba(245, 197, 24, .35)
        }

        .hud-corner--tr {
            top: 16px;
            right: 16px;
            border-top: 1px solid rgba(245, 197, 24, .35);
            border-right: 1px solid rgba(245, 197, 24, .35)
        }

        .hud-corner--bl {
            bottom: 16px;
            left: 16px;
            border-bottom: 1px solid rgba(245, 197, 24, .35);
            border-left: 1px solid rgba(245, 197, 24, .35)
        }

        .hud-corner--br {
            bottom: 16px;
            right: 16px;
            border-bottom: 1px solid rgba(245, 197, 24, .35);
            border-right: 1px solid rgba(245, 197, 24, .35)
        }

        #hud-tl {
            position: absolute;
            top: 20px;
            left: 44px;
            pointer-events: none;
            z-index: 5;
            font-family: 'Raleway', sans-serif;
        }

        .hud-label {
            font-size: .45rem;
            letter-spacing: .28em;
            color: rgba(245, 197, 24, .25);
            text-transform: uppercase;
            margin-bottom: 3px
        }

        .hud-val {
            font-family: 'Cinzel', serif;
            font-size: .7rem;
            color: rgba(245, 197, 24, .5)
        }

        #hud-tr {
            position: absolute;
            top: 20px;
            right: 44px;
            pointer-events: none;
            z-index: 5;
            text-align: right;
            font-family: 'Raleway', sans-serif;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #hud-br {
            position: absolute;
            bottom: 20px;
            right: 44px;
            pointer-events: none;
            z-index: 5;
            text-align: right;
            font-family: 'Raleway', sans-serif;
        }

        /* Loading overlay */
        #loader {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: radial-gradient(ellipse at center, rgba(160, 160, 160, .98), rgba(180, 180, 180, .99));
            transition: opacity .5s;
            pointer-events: none;
        }

        #loader.hidden {
            opacity: 0
        }

        .loader-bat {
            animation: loaderPulse 1.2s ease-in-out infinite
        }

        @keyframes loaderPulse {

            0%,
            100% {
                filter: drop-shadow(0 0 8px rgba(245, 197, 24, .4))
            }

            50% {
                filter: drop-shadow(0 0 24px rgba(245, 197, 24, .9))
            }
        }

        .loader-text {
            font-family: 'Raleway', sans-serif;
            font-size: .55rem;
            letter-spacing: .4em;
            color: rgba(60, 60, 60, .8);
            text-transform: uppercase;
        }

        .loader-bar-wrap {
            width: 200px;
            height: 1px;
            background: rgba(245, 197, 24, .1);
            position: relative;
            overflow: hidden;
        }

        .loader-bar {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, transparent, var(--gold), transparent);
            animation: loaderSweep 1.4s ease-in-out infinite;
        }

        @keyframes loaderSweep {
            0% {
                left: -100%
            }

            100% {
                left: 100%
            }
        }

        /* Drag hint */
        #drag-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Raleway', sans-serif;
            font-size: .48rem;
            letter-spacing: .25em;
            color: rgba(40, 40, 40, .45);
            text-transform: uppercase;
            pointer-events: none;
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: hintPulse 3s ease-in-out infinite;
        }

        @keyframes hintPulse {

            0%,
            100% {
                opacity: .4
            }

            50% {
                opacity: .9
            }
        }

        /* Scanlines */
        #scanlines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0, 0, 0, .02) 3px, rgba(0, 0, 0, .02) 4px);
            opacity: .6;
        }

        /* ─── Info bar ───────────────────────────────────── */
        #infobar {
            grid-column: 1/-1;
            display: flex;
            align-items: stretch;
            background: rgba(0, 0, 0, .65);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            transition: opacity .3s;
            overflow: hidden;
        }

        #infobar.switching {
            opacity: 0
        }

        .ib-name-block {
            padding: 0 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid rgba(245, 197, 24, .07);
            min-width: 260px;
        }

        .ib-era {
            font-family: 'Raleway', sans-serif;
            font-size: .48rem;
            letter-spacing: .25em;
            color: rgba(245, 197, 24, .4);
            text-transform: uppercase;
            margin-bottom: 5px
        }

        .ib-name {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            white-space: nowrap
        }

        .ib-desc {
            flex: 1;
            padding: 0 32px;
            font-family: 'Raleway', sans-serif;
            font-size: .75rem;
            line-height: 1.75;
            color: #3a3a3a;
            font-weight: 300;
            display: flex;
            align-items: center;
            border-right: 1px solid rgba(245, 197, 24, .05);
        }

        .ib-specs {
            display: flex;
            align-items: stretch
        }

        .ib-spec {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 28px;
            border-right: 1px solid rgba(245, 197, 24, .05);
            gap: 5px;
            min-width: 110px;
        }

        .ib-spec:last-child {
            border-right: none
        }

        .ib-spec-key {
            font-family: 'Raleway', sans-serif;
            font-size: .45rem;
            letter-spacing: .2em;
            color: #222;
            text-transform: uppercase
        }

        .ib-spec-val {
            font-family: 'Cinzel', serif;
            font-size: .78rem;
            color: #666
        }
    </style>
</head>

{
  "imports": {

</script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

        // ── DATA ──────────────────────────────────────────────────────
        const CARS = [
            {
                id: 'tumbler',
                file: 'tumbler_2008.glb',
                name: 'The Tumbler',
                era: 'Nolan Era · 2005–2012',
                desc: 'Military bridging vehicle repurposed as Gotham\'s ultimate pursuit machine. Designed by Lucius Fox. Splits into the Bat-Pod on catastrophic damage.',
                specs: [['Origin', 'Wayne Enterprises'], ['Engine', 'Dual Turbine'], ['Top Speed', '200+ mph'], ['Weight', '2.5 tons']],
                camPos: [0, 1.2, 5],
                scale: 1,
            },
            {
                id: 'animated',
                file: 'batman_animated_series_car.glb',
                name: 'Animated Batmobile',
                era: 'BTAS · 1992–1995',
                desc: 'Bruce Timm\'s art-deco masterpiece. Long, impossibly sleek, obsidian black. The car that looked like it drove out of a 1930s nightmare and defined a generation.',
                specs: [['Style', 'Art Deco'], ['Designer', 'Bruce Timm'], ['Colour', 'Obsidian'], ['Era', '1992–1995']],
                camPos: [0, 1.4, 6],
                scale: 1,
            },
            {
                id: 'arkham',
                file: 'arkham_knight_batmobile_advanced_rig.glb',
                name: 'Arkham Batmobile',
                era: 'Rocksteady · 2015',
                desc: 'The most heavily armed Batmobile ever built. Pursuit and Battle modes. Full AI control from the Bat-Computer. 60mm cannon. 0–240mph.',
                specs: [['Mode', 'Pursuit / Battle'], ['Cannon', '60mm M2'], ['Control', 'Remote AI'], ['Speed', '240 mph']],
                camPos: [0, 1.5, 5.5],
                scale: 1,
            },
            {
                id: 'keaton',
                file: 'michael_keaton1989batmobile.glb',
                name: 'Keaton Batmobile',
                era: 'Burton Era · 1989–1992',
                desc: 'The most iconic silhouette in superhero history. A jet turbine on wheels. 30-foot fins, retractable shields. The car that made Batman a cultural phenomenon.',
                specs: [['Engine', 'Jet Turbine'], ['Length', '30 feet'], ['Shields', 'Retractable'], ['Year', '1989']],
                camPos: [0, 1.2, 6.5],
                scale: 1,
            },
        ];

        // ── CURSOR ────────────────────────────────────────────────────
        const batCursor = document.getElementById('bat-cursor');
        const ring = document.getElementById('cursor-ring');
        let mx = window.innerWidth / 2, my = window.innerHeight / 2;
        let rx = mx, ry = my, lastAngle = 0;

        document.addEventListener('mousemove', e => {
            const dx = e.clientX - mx, dy = e.clientY - my;
            mx = e.clientX; my = e.clientY;
            if (Math.abs(dx) > .5 || Math.abs(dy) > .5)
                lastAngle = Math.atan2(dy, dx) * (180 / Math.PI);
            batCursor.style.left = mx + 'px';
            batCursor.style.top = my + 'px';
            batCursor.style.transform = `translate(-50%,-50%) rotate(${lastAngle}deg)`;
        });

        // Smooth lagging ring
        (function animRing() {
            rx += (mx - rx) * .14; ry += (my - ry) * .14;
            ring.style.left = rx + 'px'; ring.style.top = ry + 'px';
            requestAnimationFrame(animRing);
        })();

        // Hide cursor when mouse leaves the iframe window
        document.addEventListener('mouseleave', () => { batCursor.style.opacity = '0'; ring.style.opacity = '0'; });
        document.addEventListener('mouseenter', () => { batCursor.style.opacity = '1'; ring.style.opacity = '1'; });

        // ── THREE.JS SETUP ────────────────────────────────────────────
        const viewport = document.getElementById('viewport');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(viewport.clientWidth, viewport.clientHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        viewport.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        // Blender-style studio grey — neutral, slightly warm
        scene.background = new THREE.Color(0xb8b8b8);
        scene.fog = new THREE.Fog(0xb8b8b8, 18, 42);

        const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.01, 200);
        camera.position.set(0, 1.4, 5.5);

        // ── ORBIT CONTROLS ────────────────────────────────────────────
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.minDistance = 1.5;
        controls.maxDistance = 14;
        controls.maxPolarAngle = Math.PI * 0.58;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.6;
        controls.target.set(0, 0.5, 0);

        // ── LIGHTING — Blender studio setup ─────────────────────────
        // Bright ambient fills everything evenly like a studio lightbox
        const ambient = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambient);

        // Key light — strong daylight white, upper-front-left
        const keyLight = new THREE.DirectionalLight(0xfff8f2, 3.5);
        keyLight.position.set(-5, 8, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 40;
        keyLight.shadow.camera.left = -10;
        keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        keyLight.shadow.bias = -0.0005;
        keyLight.shadow.normalBias = 0.02;
        scene.add(keyLight);

        // Fill light — soft white from right, kills harsh shadows
        const fillLight = new THREE.DirectionalLight(0xf4f8ff, 2.2);
        fillLight.position.set(6, 4, 3);
        scene.add(fillLight);

        // Back/rim light — pure white from behind-above, separates car from bg
        const rimLight = new THREE.DirectionalLight(0xffffff, 1.8);
        rimLight.position.set(0, 6, -7);
        scene.add(rimLight);

        // Top softbox — straight down like a studio overhead panel
        const topLight = new THREE.DirectionalLight(0xffffff, 1.6);
        topLight.position.set(0, 10, 0);
        scene.add(topLight);

        // Hemisphere — sky/ground bounce
        const groundLight = new THREE.HemisphereLight(0xe8f0ff, 0xd8d0c8, 1.4);
        scene.add(groundLight);

        // Very subtle warm fill from front-low (ground bounce, like a reflector)
        const goldGlow1 = new THREE.PointLight(0xfff8ee, 0.5, 14);
        goldGlow1.position.set(-2, 0.2, 4);
        scene.add(goldGlow1);
        const goldGlow2 = new THREE.PointLight(0xfff8ee, 0.5, 14);
        goldGlow2.position.set(2, 0.2, 4);
        scene.add(goldGlow2);

        // ── FLOOR ────────────────────────────────────────────────────
        // Reflective dark floor
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0xaaaaaa,
            metalness: 0.0,
            roughness: 0.85,
            envMapIntensity: 0.2,
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid overlay on floor
        const gridHelper = new THREE.GridHelper(30, 30, 0x888888, 0x999999);
        gridHelper.position.y = 0.001;
        gridHelper.material.opacity = 0.35;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // Fog vignette — circular light on floor
        const spotGeo = new THREE.CircleGeometry(4, 64);
        const spotMat = new THREE.MeshBasicMaterial({
            color: 0x0d0d1a,
            transparent: true,
            opacity: 0.0,
        });
        const floorSpot = new THREE.Mesh(spotGeo, spotMat);
        floorSpot.rotation.x = -Math.PI / 2;
        floorSpot.position.y = 0.002;
        scene.add(floorSpot);

        // ── MODEL CACHE + LOADER ──────────────────────────────────────
        const loader = new THREE.LoadingManager();
        const gltfLoader = new GLTFLoader(loader);
        const modelCache = {};
        let currentModel = null;
        let isAutoRotating = true;

        const loaderEl = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');

        function setLoading(text) {
            loaderEl.classList.remove('hidden');
            loaderText.textContent = text;
        }
        function hideLoader() {
            loaderEl.classList.add('hidden');
        }

        function fitModelToView(model, camPos) {
            // Auto-scale and center any model
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Normalise: target longest dimension = 3 units
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 3.0;
            const scaleFactor = targetSize / maxDim;
            model.scale.setScalar(scaleFactor);

            // Recompute after scale
            const box2 = new THREE.Box3().setFromObject(model);
            const center2 = box2.getCenter(new THREE.Vector3());
            const min2 = box2.min;

            // Sit on floor
            model.position.set(-center2.x, -min2.y, -center2.z);

            // Cast/receive shadows — preserve original model colours
            model.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(m => {
                            if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
                                m.envMapIntensity = 0.6;
                                m.needsUpdate = true;
                            }
                        });
                    }
                }
            });
        }

        async function loadCar(idx) {
            const car = CARS[idx];

            // Already cached
            if (modelCache[car.id]) {
                swapModel(modelCache[car.id], car);
                return;
            }

            setLoading(`Loading ${car.name}…`);

            const base = window.location.href.replace(/[^/]*$/, '');
            const url = base + car.file;

            try {
                const gltf = await new Promise((res, rej) => gltfLoader.load(url, res, undefined, rej));
                const model = gltf.scene;
                fitModelToView(model, car.camPos);
                modelCache[car.id] = model;
                swapModel(model, car);
            } catch (err) {
                loaderText.textContent = 'Load failed — place GLB files in same folder as this HTML';
                console.error(err);
            }
        }

        function swapModel(model, car) {
            // Remove old
            if (currentModel) {
                scene.remove(currentModel);
            }
            currentModel = model;
            scene.add(model);

            // Animate camera to car's preferred position
            const targetPos = new THREE.Vector3(...car.camPos);
            animateCameraTo(targetPos);

            updateInfoBar(car);
            hideLoader();
        }

        function animateCameraTo(target) {
            const start = camera.position.clone();
            const startTarget = controls.target.clone();
            let t = 0;
            function step() {
                t += 0.025;
                if (t >= 1) { camera.position.copy(target); return; }
                camera.position.lerpVectors(start, target, easeInOut(t));
                controls.target.lerpVectors(startTarget, new THREE.Vector3(0, 0.5, 0), easeInOut(t));
                controls.update();
                requestAnimationFrame(step);
            }
            step();
        }
        function easeInOut(t) { return t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

        // ── BUILD SIDEBAR ─────────────────────────────────────────────
        const sidebar = document.getElementById('sidebar');
        CARS.forEach((car, i) => {
            const btn = document.createElement('button');
            btn.className = 'car-btn' + (i === 0 ? ' active' : '');
            btn.innerHTML = `
    <span class="car-num">0${i + 1}</span>
    <div class="car-info">
      <div class="car-name">${car.name}</div>
      <div class="car-era">${car.era}</div>
    </div>
    <span class="car-arrow">›</span>
    <span class="car-load">loading…</span>
  `;
            btn.addEventListener('click', () => selectCar(i));
            sidebar.appendChild(btn);
        });

        let currentIdx = 0;
        function selectCar(idx) {
            if (idx === currentIdx && modelCache[CARS[idx].id]) return;
            currentIdx = idx;
            document.querySelectorAll('.car-btn').forEach((b, i) => {
                b.classList.toggle('active', i === idx);
            });
            document.getElementById('infobar').classList.add('switching');
            setTimeout(() => document.getElementById('infobar').classList.remove('switching'), 350);
            loadCar(idx);
        }

        function updateInfoBar(car) {
            document.getElementById('ib-era').textContent = car.era;
            document.getElementById('ib-name').textContent = car.name;
            document.getElementById('ib-desc').textContent = car.desc;
            document.getElementById('ib-specs').innerHTML = car.specs.map(([k, v]) =>
                `<div class="ib-spec"><div class="ib-spec-key">${k}</div><div class="ib-spec-val">${v}</div></div>`
            ).join('');
        }

        // ── CONTROLS UI ───────────────────────────────────────────────
        document.getElementById('btn-autorotate').addEventListener('click', () => {
            isAutoRotating = !isAutoRotating;
            controls.autoRotate = isAutoRotating;
            document.getElementById('btn-autorotate').textContent = isAutoRotating ? '⟳ Auto Rotate' : '⏸ Paused';
        });
        document.getElementById('btn-reset').addEventListener('click', () => {
            const car = CARS[currentIdx];
            animateCameraTo(new THREE.Vector3(...car.camPos));
            controls.target.set(0, 0.5, 0);
            controls.autoRotate = true;
            isAutoRotating = true;
            document.getElementById('btn-autorotate').textContent = '⟳ Auto Rotate';
        });

        // Keyboard
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') selectCar((currentIdx + 1) % CARS.length);
            if (e.key === 'ArrowLeft') selectCar((currentIdx - 1 + CARS.length) % CARS.length);
            if (e.key === ' ') { document.getElementById('btn-autorotate').click(); e.preventDefault(); }
            if (e.key === 'r') document.getElementById('btn-reset').click();
        });

        // Double-click resets
        viewport.addEventListener('dblclick', () => document.getElementById('btn-reset').click());

        // ── HUD UPDATES ───────────────────────────────────────────────
        function updateHUD() {
            const angles = controls.getAzimuthalAngle();
            const polar = controls.getPolarAngle();
            const zoom = camera.position.distanceTo(controls.target);
            document.getElementById('hud-rot').textContent = Math.round(angles * 180 / Math.PI) + '°';
            document.getElementById('hud-elev').textContent = Math.round((Math.PI / 2 - polar) * 180 / Math.PI) + '°';
            document.getElementById('hud-zoom').textContent = (5.5 / zoom).toFixed(1) + '×';
        }

        // ── RESIZE ───────────────────────────────────────────────────
        const ro = new ResizeObserver(() => {
            const w = viewport.clientWidth, h = viewport.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        });
        ro.observe(viewport);

        // ── RENDER LOOP ──────────────────────────────────────────────
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;

            controls.update();
            updateHUD();

            // Very subtle warm fill pulse
            goldGlow1.intensity = 0.4 + Math.sin(time) * 0.08;
            goldGlow2.intensity = 0.4 + Math.sin(time + Math.PI) * 0.08;

            renderer.render(scene, camera);
        }
        animate();

        // ── START ────────────────────────────────────────────────────
        loadCar(0);
    </script>
</body>

</html>
